name: Run Xbox Protocol Bot

on:
  schedule:
    - cron: '13 7 * * *'  # 7h13 UTC = 9h13 en France (Esquive le rush de 9h00/9h30)
    - cron: '52 14 * * *' # 14h52 UTC = 16h52 en France (Esquive le rush de 17h00)
    - cron: '41 20 * * *' # 20h41 UTC = 22h41 en France (Esquive le rush de 23h00)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les bibliothèques
        run: |
          pip install atproto google-genai

      - name: Exécuter le script du Bot
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
